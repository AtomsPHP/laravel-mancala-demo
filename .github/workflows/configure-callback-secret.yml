name: Configure Callback Channel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Worker runtime
        run: |
          npm ci
          npm run atoms:init
          npm ci --prefix .atoms/worker

      # Two values `atoms deploy` never sends. They go in as Worker secrets
      # rather than wrangler.jsonc vars because the deploy action regenerates
      # .atoms/worker on every run.
      #
      # ORDER MATTERS: Laravel must already hold the identical
      # ATOMS_SHARED_SECRET, or it is locked out until it does. Running this
      # also invalidates outstanding WebSocket tickets; browsers re-mint on
      # reconnect. See docs/deployment.md.
      - name: Store the callback channel and shared secret in the Worker
        env:
          ATOMS_SHARED_SECRET: ${{ secrets.ATOMS_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ATOMS_SHARED_SECRET" ]; then
            echo "::error::The ATOMS_SHARED_SECRET repository secret is missing."
            exit 1
          fi
          # Must decode to exactly 32 bytes, or the Worker answers
          # `misconfigured` on every route but /healthz.
          if [ "$(printf '%s' "$ATOMS_SHARED_SECRET" | base64 -d 2>/dev/null | wc -c | tr -d ' ')" != "32" ]; then
            echo "::error::ATOMS_SHARED_SECRET must be base64 of 32 bytes (openssl rand -base64 32)."
            exit 1
          fi
          url="$(jq -er '.callback_url.production' atoms.json)"
          cd .atoms/worker
          printf '%s' "$url" \
            | npx wrangler secret put ATOMS_CALLBACK_URL \
                --name atoms-mancala-demo
          printf '%s' "$ATOMS_SHARED_SECRET" \
            | npx wrangler secret put ATOMS_SHARED_SECRET \
                --name atoms-mancala-demo
