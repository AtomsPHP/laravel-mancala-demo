name: Configure Callback Channel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Worker runtime
        run: |
          npm exec --yes \
            --package=@atomsphp/runtime-cloudflare@0.1.0 \
            -- atoms-runtime-cloudflare init .atoms/worker
          npm ci --prefix .atoms/worker

      # The callback channel takes two values and `atoms deploy` sends neither:
      # ATOMS_CALLBACK_URL tells the Worker where to reach Laravel, and
      # ATOMS_CALLBACK_SIGNING_KEY lets Laravel prove the caller was the Worker.
      # With the URL unset, dispatch() fails closed and no game reaches the lobby.
      # Both go in as secrets rather than wrangler.jsonc vars, because the deploy
      # action regenerates .atoms/worker on every run.
      - name: Store the callback channel in the Worker
        env:
          ATOMS_CALLBACK_SIGNING_KEY: ${{ secrets.ATOMS_CALLBACK_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ATOMS_CALLBACK_SIGNING_KEY" ]; then
            echo "::error::The ATOMS_CALLBACK_SIGNING_KEY repository secret is missing."
            exit 1
          fi
          url="$(jq -er '.callback_url.production' atoms.json)"
          cd .atoms/worker
          printf '%s' "$url" \
            | npx wrangler secret put ATOMS_CALLBACK_URL \
                --name atoms-mancala-demo
          printf '%s' "$ATOMS_CALLBACK_SIGNING_KEY" \
            | npx wrangler secret put ATOMS_CALLBACK_SIGNING_KEY \
                --name atoms-mancala-demo
