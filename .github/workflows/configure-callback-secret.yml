name: Configure Callback Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Worker runtime
        run: |
          npm exec --yes \
            --package=@atomsphp/runtime-cloudflare@0.1.0 \
            -- atoms-runtime-cloudflare init .atoms/worker
          npm ci --prefix .atoms/worker

      - name: Store callback signing key in the Worker
        working-directory: .atoms/worker
        env:
          ATOMS_CALLBACK_SIGNING_KEY: ${{ secrets.ATOMS_CALLBACK_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ATOMS_CALLBACK_SIGNING_KEY" ]; then
            echo "::error::The ATOMS_CALLBACK_SIGNING_KEY repository secret is missing."
            exit 1
          fi
          printf '%s' "$ATOMS_CALLBACK_SIGNING_KEY" \
            | npx wrangler secret put ATOMS_CALLBACK_SIGNING_KEY \
                --name atoms-mancala-demo
